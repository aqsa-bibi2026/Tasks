>

id="customerEmail"

type="date"
id="bookingDate"
>

</option>


<option>

</option>


<option>

</option>


<option>

</option>

</option>


<option>

</option>


<option>
4 People
</option>


<option>
6 People
</option>


<option>
10 People
</option>


</select>

id="message"
rows="5"
placeholder="Special Request">
</textarea>
