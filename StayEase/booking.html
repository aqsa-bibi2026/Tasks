<!DOCTYPE html><html><head><title>Booking</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head><body>
<section><h1>Reserve Your Stay</h1>
<form class="form" id="booking">
<input placeholder="Full Name" required>
<input type="email" placeholder="Email" required>
<input placeholder="Phone" required>
<label>Check In</label><input type="date" required>
<label>Check Out</label><input type="date" required>
<select><option>Royal Suite</option><option>Deluxe Room</option><option>Family Room</option></select>
<textarea placeholder="Special Request"></textarea>
<button class="btn">Confirm Booking</button>
</form></section><script src="js/script.js"></script></body></html>
