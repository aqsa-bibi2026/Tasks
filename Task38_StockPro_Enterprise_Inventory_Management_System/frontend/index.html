<!DOCTYPE html>
<html>

<head>

<title>
StockPro Enterprise
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<nav>

<h2>
StockPro <span>Enterprise</span>
</h2>

<div>
Dashboard | Products | Orders | Reports
</div>

</nav>





<section>


<h1>
Smart Inventory Management
</h1>


<p>
Enterprise Inventory Platform For Modern Businesses
</p>





<div class="cards">


<div class="card">

<h3>
Total Products
</h3>

<h2>
1250
</h2>

</div>




<div class="card">

<h3>
Low Stock Alerts
</h3>

<h2>
24
</h2>

</div>





<div class="card">

<h3>
Monthly Sales
</h3>

<h2>
$48,500
</h2>

</div>



</div>







<div class="box">


<h2>
Add New Product
</h2>




<input 
type="text"
id="productName"
placeholder="Product Name"
/>




<input
type="text"
id="category"
placeholder="Category"
/>





<input
type="number"
id="quantity"
placeholder="Quantity"
/>





<input
type="number"
id="price"
placeholder="Price"
/>






<button onclick="addProduct()">

Add Product

</button>





<p id="message"></p>



</div>




</section>








<script>


async function addProduct(){



const name =
document.getElementById("productName").value;



const category =
document.getElementById("category").value;



const quantity =
document.getElementById("quantity").value;



const price =
document.getElementById("price").value;






if(
name === "" ||
category === "" ||
quantity === ""
){


document.getElementById("message").innerHTML =
"Please fill all required fields";


return;


}





try{



const response = await fetch(

"http://localhost:5000/api/products",

{


method:"POST",


headers:{


"Content-Type":"application/json"


},



body:JSON.stringify({


name:name,

category:category,

quantity:quantity,

price:price


})



}


);






const data =
await response.json();





console.log(data);






if(data.success){



document.getElementById("message").innerHTML =
"✅ Product Added Successfully";



}


else{



document.getElementById("message").innerHTML =
"❌ Product Failed";


}



}



catch(error){



console.log(error);



document.getElementById("message").innerHTML =
"❌ Backend Server Not Connected";



}



}



</script>





</body>

</html>
